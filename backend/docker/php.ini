; Production PHP settings for the API container.
; Loaded after the image defaults, so these values win.

upload_max_filesize = 24M
post_max_size = 28M
memory_limit = 256M
max_execution_time = 120
expose_php = Off

; Realpath cache is core PHP, not OPcache.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Code is baked into the image; a deployment recreates the container.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
