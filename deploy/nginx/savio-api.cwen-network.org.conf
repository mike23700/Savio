# Host nginx site for the Laravel API.
# Copy to /etc/nginx/sites-available/ and enable with a symlink:
#   ln -s /etc/nginx/sites-available/savio-api.cwen-network.org \
#         /etc/nginx/sites-enabled/savio-api.cwen-network.org
#
# Certbot adds the TLS listener, certificate paths and the HTTP-to-HTTPS
# redirect when you run:
#   certbot --nginx -d savio-api.cwen-network.org
#
# The api container publishes PHP-FPM on 127.0.0.1 only. Docker is not
# reachable from the internet on port 9000 or 3306.

server {
    listen 80;
    listen [::]:80;
    server_name savio-api.cwen-network.org;

    # Uploads go through Laravel (images, audio, PDFs).
    client_max_body_size 30m;

    location / {
        include fastcgi_params;

        # Every request goes to Laravel's front controller.
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;

        # TLS is terminated here; tell Laravel the request is HTTPS.
        fastcgi_param HTTPS on;

        # CHANGE ME if API_FCGI_PORT in .env is not 9201.
        fastcgi_pass 127.0.0.1:9201;

        fastcgi_read_timeout 120s;

        add_header X-Content-Type-Options nosniff always;
    }
}
