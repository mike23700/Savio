# Host nginx site for the public website.
# Copy to /etc/nginx/sites-available/ and enable with a symlink:
#   ln -s /etc/nginx/sites-available/savio.cwen-network.org \
#         /etc/nginx/sites-enabled/savio.cwen-network.org
#
# Certbot adds the TLS listener, certificate paths and the HTTP-to-HTTPS
# redirect when you run:
#   certbot --nginx -d savio.cwen-network.org

server {
    listen 80;
    listen [::]:80;
    server_name savio.cwen-network.org;

    # CHANGE ME if the repository is not cloned at /opt/savio.
    root /opt/savio/dist;
    index index.html;

    client_max_body_size 1m;

    # Runtime configuration. It overrides the API URL baked into the bundle,
    # so it must never be cached by browsers or intermediaries.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Vite fingerprints everything under /assets/: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other hashed static files (favicon, images copied from public/).
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA entry point must be revalidated on every deployment.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # React Router handles client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
